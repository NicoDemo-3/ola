<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ola (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F6;--surface:#FFFFFF;--card:#E8E8ED;--raise:#DADAE1;--line:#D0D0D8;--text:#0E0E12;--muted:#5D5E67;
  --accent:#0E8F84;--next:#A87505;--end:#0E8F84;--danger:#C2402F;--onaccent:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--surface:#18181C;--card:#222328;--raise:#2E2F35;--line:#2C2D33;--text:#FFFFFF;--muted:#9C9DA5;
    --accent:#4FE3D2;--next:#F2C14E;--end:#4FE3D2;--danger:#FF7A68;--onaccent:#000000;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--surface:#18181C;--card:#222328;--raise:#2E2F35;--line:#2C2D33;--text:#FFFFFF;--muted:#9C9DA5;
  --accent:#4FE3D2;--next:#F2C14E;--end:#4FE3D2;--danger:#FF7A68;--onaccent:#000000;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;position:relative}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;overscroll-behavior:contain}

/* headers */
.head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 14px}
.head h1{margin:0;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.phead{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;min-height:56px}
.phead .ptitle{font-weight:700;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin:8px 0 26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 16px 12px}
.sec-h h2{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.015em}
.sec-h .sub{display:block;color:var(--muted);font-size:.9rem;font-weight:400;margin-top:4px;letter-spacing:0}
.link{background:none;border:0;color:var(--muted);font-weight:600;padding:4px 0;white-space:nowrap}
h2.plain{font-size:1.2rem;margin:22px 16px 8px}
.note{margin:0 16px 12px;color:var(--muted);font-size:.92rem;max-width:62ch}

/* controls */
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--card);color:var(--text)}
.btn.primary{background:var(--text);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:4px 16px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);color:var(--text);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.iconbtn{width:42px;height:42px;border:0;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center;flex:none;padding:0}
.iconbtn.on,.heart[aria-pressed="true"]{color:var(--accent)}
.iconbtn.strong{color:var(--text)}
.search{display:block;margin:0 16px 16px;width:calc(100% - 32px);padding:13px 16px;border-radius:8px;border:0;background:var(--text);color:var(--bg);font-size:1.05rem;font-weight:600}
.search::placeholder{color:var(--muted)}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.tag.new{border-color:var(--accent);color:var(--accent)}

/* covers, cards, tiles */
.cover{aspect-ratio:1;border-radius:6px;background:hsl(var(--h) 36% 36%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:2.2rem;overflow:hidden;position:relative;width:100%}
.cover.round{border-radius:50%}
.cover.radio{background:var(--card);color:var(--muted)}
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:stretch}
.collage i{background:hsl(var(--h) 36% 36%)}
.mixlabel{position:absolute;left:10px;right:10px;bottom:9px;font-size:1.15rem;line-height:1.05;font-weight:800;text-align:left;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:0 16px;scroll-padding-inline:16px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:0 0 40%;max-width:190px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left}
.card.artist{flex-basis:34%;text-align:center}
.ct{font-weight:600;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morecard .cover{background:var(--card);color:var(--text);font-size:1rem;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:0 16px}
.grid .card{max-width:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border:0;border-radius:8px;padding:8px;text-align:left;min-width:0}
.tile .cover{width:52px;flex:none;font-size:1.1rem;border-radius:4px}
.tile .meta{min-width:0}
.listbtn{display:flex;align-items:center;gap:14px;width:100%;padding:8px 16px;background:none;border:0;text-align:left}
.listbtn .cover{width:56px;flex:none;font-size:1.2rem}
.listbtn:hover,.tile:hover{background:var(--raise)}
.meta{flex:1;min-width:0}
.t,.s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{font-weight:600}
.s{color:var(--muted);font-size:.88rem}
.empty-card{margin:0 16px;padding:16px;border-radius:10px;background:var(--card)}
.empty-card p{margin:0 0 12px;color:var(--muted)}

/* rows */
.list{list-style:none;margin:0;padding:0}
.row{position:relative;height:64px;overflow:hidden}
.drag-list>li{transition:transform .15s ease}
.drag-list>li.dragging{transition:none;z-index:3;overflow:visible}
.row-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;color:var(--onaccent)}
.row-bg span{opacity:0;transition:transform .15s}
.row.dir-right .bg-r,.row.dir-left .bg-l{opacity:1}
.row.armed .row-bg span{transform:scale(1.12)}
.row-fg{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;touch-action:pan-y;transition:transform .2s ease;user-select:none;-webkit-user-select:none;cursor:pointer}
.row-fg.moving{transition:none}
.dragging .row-fg,.srow.dragging{background:var(--raise);box-shadow:0 8px 24px rgba(0,0,0,.3);border-radius:10px}
.row.playing .t{color:var(--accent)}
.art{width:46px;height:46px;border-radius:4px;background:hsl(var(--h) 36% 36%);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.handle{touch-action:none;cursor:grab}
.nowcard{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:10px;border-radius:10px;background:var(--card)}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 16px 12px;font-size:.88rem;color:var(--muted)}
.path .chip{padding:4px 11px;font-size:.84rem;cursor:default}
.path .chip:last-child{background:var(--text);color:var(--bg)}

/* events */
.evrow{display:flex;align-items:center;gap:14px;width:100%;padding:10px 16px;background:none;border:0;text-align:left}
.evrow:hover{background:var(--raise)}
.evdate{width:52px;flex:none;text-align:center;background:var(--card);border-radius:8px;padding:6px 0;line-height:1.1}
.evdate b{display:block;font-size:1.3rem}
.evdate span{font-size:.75rem;color:var(--muted);font-weight:600}
.s2{color:var(--muted);font-size:.8rem}

/* page heroes */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 16px 14px}
.hero .cover{width:62%;max-width:260px;font-size:4rem}
.hero h1{margin:16px 0 4px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .s{white-space:normal}
.hero .actions{justify-content:center;padding-top:14px}

/* settings */
.field{padding:14px 16px;border-top:1px solid var(--line)}
.field .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field label{font-weight:600}
.field small{display:block;color:var(--muted);font-size:.86rem;margin-top:4px;max-width:56ch}
.inp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:58%}
.inp.full{width:100%;max-width:none;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--raise);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--accent)} .switch:checked::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:2ch;text-align:center;font-weight:700}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none}
.stepper button:disabled{opacity:.35}
.slist{list-style:none;margin:0 0 8px;padding:0 8px}
.srow{height:56px;display:flex;align-items:center;gap:8px;padding:0 8px 0 0;background:var(--bg);border-radius:10px}
.srow .sl{flex:1;font-weight:600}
.srow.off .sl{color:var(--muted)}

/* mini + nav */
.mini{margin:0 10px 8px;background:var(--surface);border-radius:10px;display:flex;align-items:center;gap:10px;padding:7px 4px 7px 7px;position:relative;overflow:hidden;cursor:pointer}
.mini[hidden]{display:none}
.mini .art{width:42px;height:42px}
.mini .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--text);width:0}
.navwrap{padding:0 12px 10px}
nav{display:flex;background:var(--surface);border-radius:999px;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--muted);height:52px;border-radius:999px;display:grid;place-items:center}
nav button[aria-current="page"]{background:var(--raise);color:var(--text)}

/* now playing */
.np{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;overflow-y:auto}
.np.open{transform:none;visibility:visible;transition:transform .28s ease}
.np-inner{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 22px calc(env(safe-area-inset-bottom,0px) + 24px)}
.np-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;gap:8px}
.np-top span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speedbtn{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 9px;font-size:.78rem}
.bigart{width:100%;max-width:340px;aspect-ratio:1;margin:12px auto 18px;border-radius:10px;background:hsl(var(--h) 36% 36%);display:grid;place-items:center;color:#fff;font-size:6rem;font-weight:800}
.np-title{display:flex;align-items:center;gap:8px}
.np-title .t{font-size:1.45rem;font-weight:800;letter-spacing:-.015em}
.np-title .s{font-size:1rem}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;margin:8px 0 6px}
.controls .iconbtn{width:52px;height:52px;color:var(--text)}
.controls .iconbtn.on{color:var(--accent)}
.playbtn{width:68px;height:68px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-items:center}
.sleeplbl{font-size:.68rem;color:var(--accent);font-variant-numeric:tabular-nums;height:1em;text-align:center}
.np-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.lyrics{margin-top:14px;padding:16px;border-radius:12px;background:var(--card);color:var(--muted);font-size:1.05rem;line-height:1.7}
.lyrics[hidden]{display:none}
.scrobline{text-align:center;color:var(--muted);font-size:.8rem;margin-top:12px}

/* sheet + toast */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:60}
.backdrop.open{display:flex}
.sheet{width:100%;max-width:600px;background:var(--surface);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:82%;overflow:auto}
.sh-head{display:flex;align-items:center;gap:12px;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;padding:14px 12px;border:0;background:none;font-size:1.03rem;border-radius:10px}
.opt:hover{background:var(--raise)}
.opt.back{text-align:center;color:var(--muted);border:1px solid var(--line);margin-top:8px}
.opt.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:11px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);transition:opacity .18s,transform .18s;z-index:70;font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
/* low distraction mode (v1 look) */
:root[data-mode="low"]{--bg:#EEF3F1;--surface:#FFFFFF;--card:#E1EBE8;--raise:#D3E0DC;--line:#CCDAD6;--text:#12262E;--muted:#536E76;--accent:#1A8466;--next:#A87505;--end:#1A8466;--danger:#B9472F;--onaccent:#FFFFFF}
@media (prefers-color-scheme:dark){:root[data-mode="low"]:not([data-theme="light"]){--bg:#13262F;--surface:#1A333E;--card:#1F3B47;--raise:#24434F;--line:#2F5262;--text:#EAF1EC;--muted:#9AB3B4;--accent:#7FD8BE;--next:#F2C14E;--end:#7FD8BE;--danger:#F08A76;--onaccent:#13262F}}
:root[data-theme="dark"][data-mode="low"]{--bg:#13262F;--surface:#1A333E;--card:#1F3B47;--raise:#24434F;--line:#2F5262;--text:#EAF1EC;--muted:#9AB3B4;--accent:#7FD8BE;--next:#F2C14E;--end:#7FD8BE;--danger:#F08A76;--onaccent:#13262F}
.lowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px}
.lowhead h1{margin:0;font-size:2.1rem;font-weight:800;letter-spacing:-.025em;line-height:1}
.head .pills,.lowhead .pills{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:600;white-space:nowrap}
.pill.on{border-color:var(--accent);color:var(--accent)}
.divider{list-style:none;padding:14px 16px 6px;font-weight:700;color:var(--muted);font-size:.9rem}
.hint{margin:0 16px 12px;padding:12px 14px;border-radius:12px;background:var(--card);font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.hint p{margin:0;flex:1}.hint b.n{color:var(--next)}.hint b.e{color:var(--end)}
.scrob{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;font-size:.88rem}
.scrob span:last-child{color:var(--muted);flex:none}
:root[data-mode="low"] .search{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:500;border-radius:12px}
nav.low button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;height:56px}
.tcard{margin:0 16px 14px;padding:12px;border-radius:12px;background:var(--card)}
.tsws{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tsw{height:64px;border-radius:8px;display:flex;align-items:flex-end;gap:6px;padding:8px;position:relative;border:1px solid var(--line)}
.tsw i{width:18px;height:18px;border-radius:50%;display:block}
.tsw b{position:absolute;top:7px;left:10px;font-size:1.05rem}
.tsw small{position:absolute;top:9px;right:10px;font-size:.7rem;opacity:.8}
.tmeta{margin-top:10px}
.chip.mine{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tcard .btn{background:var(--raise)}
a.btn{display:inline-block;text-decoration:none}
.lowhead{flex-wrap:wrap}
.tpreview{margin:14px 16px 0;padding:14px;border-radius:12px}
.cpick{width:56px;height:38px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.about{display:flex;align-items:center;gap:14px;padding:0 16px 24px}
.logo-btn{border:0;background:none;padding:0;width:64px;height:64px;flex:none}
.logo-btn svg{width:64px;height:64px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <main id="main"></main>
  <div class="mini" id="mini" hidden role="button" tabindex="0" aria-label="Open now playing">
    <div class="art" id="mini-art"></div>
    <div class="meta"><div class="t" id="mini-t"></div><div class="s" id="mini-s"></div></div>
    <button class="iconbtn strong" id="mini-q" aria-label="Open queue"></button>
    <button class="iconbtn strong" id="mini-play" aria-label="Play"></button>
    <button class="iconbtn strong" id="mini-next" aria-label="Next song"></button>
    <div class="bar" id="mini-bar"></div>
  </div>
  <div class="navwrap"><nav id="nav">
    <button data-tab="home" aria-label="Home"></button>
    <button data-tab="updates" aria-label="Updates"></button>
    <button data-tab="search" aria-label="Search"></button>
    <button data-tab="collection" aria-label="Collection"></button>
  </nav></div>
</div>

<section class="np" id="np" aria-label="Now playing">
  <div class="np-inner">
    <div class="np-top">
      <button class="iconbtn strong" id="np-close" aria-label="Close now playing"></button>
      <span id="np-from"></span>
      <button class="speedbtn" id="np-speed" title="Speeds up playback to test scrobbling and the sleep timer">1x</button>
    </div>
    <div class="bigart" id="np-art"></div>
    <div class="np-title">
      <div class="meta"><div class="t" id="np-t"></div><div class="s" id="np-s"></div></div>
      <button class="iconbtn heart" id="np-heart" aria-label="Add to Liked tracks"></button>
    </div>
    <input type="range" id="np-seek" min="0" max="100" value="0" aria-label="Seek">
    <div class="times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
    <div class="controls">
      <div><button class="iconbtn" id="np-shuffle" aria-label="Smart shuffle"></button><div class="sleeplbl"></div></div>
      <button class="iconbtn" id="np-prev" aria-label="Previous"></button>
      <button class="playbtn" id="np-play" aria-label="Play"></button>
      <button class="iconbtn" id="np-next" aria-label="Next"></button>
      <div><button class="iconbtn" id="np-sleep" aria-label="Sleep timer"></button><div class="sleeplbl" id="np-sleeplbl"></div></div>
    </div>
    <div class="np-row">
      <button class="chip" id="np-queue">Queue</button>
      <button class="chip" id="np-lyr">Lyrics</button>
      <button class="chip" id="np-artist">Go to artist</button>
      <button class="chip" id="np-dj">Start DJ from this</button>
    </div>
    <div class="lyrics" id="np-lyrics" hidden>Lyrics will show here, synced to the song, once the app is connected to Tidal. The prototype only has sample songs.</div>
    <div class="scrobline" id="np-scrob"></div>
  </div>
</section>

<div class="backdrop" id="backdrop"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);

  let i=S.bag.findIndex(id=>T(id).artist!==la&&!recent.has(id));if(i<0)i=0;return S.bag.splice(i,1)[0]}
function djAdd(count){const d=S.dj;
  for(let k=0;k<count;k++){
    if(d.drift&&!d.radio&&d.count>0&&d.count%d.every===0&&(NEIGH[d.genre]||[]).length){const prev=d.path[d.path.length-2];const nb=NEIGH[d.genre];const o=nb.filter(g=>g!==prev);d.genre=pick(o.length?o:nb);d.path.push(d.genre);if(d.path.length>8)d.path.shift()}
    d.count++;
    const recent=new Set([S.current,...S.history.slice(-25),...S.queue.map(q=>q.id)]);
    let c=CATALOG.filter(t=>t.genre===d.genre&&!recent.has(t.id));
    if(!c.length)c=CATALOG.filter(t=>NEIGH[d.genre].includes(t.genre)&&!recent.has(t.id));
    if(!c.length)c=CATALOG.filter(t=>!recent.has(t.id));if(!c.length)return;
    const wantNew=Math.random()*100<d.newPct;const pool=c.filter(t=>isSaved(t.id)!==wantNew);const t=pick(pool.length?pool:c);
    S.queue.push({id:t.id,src:"dj",fresh:!isSaved(t.id)})}}
function refill(){
  if(S.dj.on){const c=S.queue.filter(q=>q.src==="dj").length;if(c<5)djAdd(5-c);return}
  if(S.shuffle){let c=S.queue.filter(q=>q.src==="shuffle").length;while(c<3){const id=drawBag();if(!id)break;S.queue.push({id,src:"shuffle"});c++}}}
function startTrack(id){if(S.current){S.history.push(S.current);if(S.history.length>60)S.history.shift()}S.current=id;S.pos=0;S.playing=true;ui.scrobbledCur=false;ui.startedAt=Date.now();ui.audio.loadedId=null;refill();after();lfmNowPlaying(T(id))}
function next(auto){
  if(auto&&S.sleep&&S.sleep.mode==="track"){S.sleep=null;S.playing=false;S.pos=0;toast("Sleep timer ended. Paused.");after();return}
  refill();const it=S.queue.shift();if(it)startTrack(it.id);else{S.playing=false;S.pos=0;toast("End of queue");after()}}
function prev(){if(S.pos>3||!S.history.length){S.pos=0;audioSeek(0);after();return}S.queue.unshift({id:S.current,src:"you"});S.current=S.history.pop();S.pos=0;ui.scrobbledCur=false;after()}
function recordRecent(kind,id){if(!["playlist","album","artist","mix","genre","liked"].includes(kind))return;S.recent=[{kind,id,at:Date.now()},...S.recent.filter(r=>!(r.kind===kind&&r.id===id))].slice(0,12)}
function playFromList(ids,idx,ctx){
  if(S.dj.on){S.dj.on=false;S.dj.radio=null}
  S.ctxList=ids.slice();S.ctxName=ctx.name;S.bag=[];S.queue=S.queue.filter(q=>q.src==="you");
  recordRecent(ctx.kind,ctx.id);startTrack(ids[idx]);
  if(!S.shuffle){ids.slice(idx+1,idx+51).forEach(id=>S.queue.push({id,src:"ctx"}));after()}}
function ctxOf(kind,id){switch(kind){
  case "playlist":{const p=PL(id);return p&&{ids:p.ids,name:p.name}}
  case "album":{const a=ALBY[id];return a&&{ids:a.tracks,name:a.title}}
  case "artist":return ARBY[id]&&{ids:(ARBY[id].top&&ARBY[id].top.length)?ARBY[id].top:artistTracks(id),name:ARBY[id].name}
  case "mix":{const m=getMix(id);return m&&{ids:m.ids,name:m.name}}
  case "liked":return{ids:S.saved,name:"Liked tracks"}
  case "downloads":return{ids:S.downloads,name:"Downloads"}
  case "genre":return{ids:CATALOG.filter(t=>t.genre===id).map(t=>t.id),name:id}
  case "rgenre":{const st=ui.gs&&ui.gs[id];return st&&st.tracks?{ids:sortTracks(st.tracks,S.set.searchSort||"rel"),name:id}:null}}return null}
function playCtx(kind,id,shuf){const c=ctxOf(kind,id);if(!c||!c.ids.length)return;
  if(shuf&&!S.shuffle){S.shuffle=true;toast("Smart shuffle on. No repeats until the whole list has played.")}
  if(!shuf&&S.shuffle)S.shuffle=false;
  playFromList(c.ids,shuf?Math.floor(Math.random()*c.ids.length):0,{name:c.name,kind,id})}
function toggleShuffle(){S.shuffle=!S.shuffle;S.queue=S.queue.filter(q=>q.src==="you"||q.src==="dj");S.bag=[];
  if(S.shuffle){refill();toast(S.dj.on?"Smart shuffle on. It takes over when the DJ stops.":"Smart shuffle on. No repeats until the whole list has played.")}
  else{if(!S.dj.on){const i=S.ctxList.indexOf(S.current);S.ctxList.slice(i+1,i+51).forEach(id=>S.queue.push({id,src:"ctx"}))}toast("Smart shuffle off")}after()}
function toggleSave(id){const x=S.realMode?" in Ola only. Syncing likes to Tidal comes next.":"";if(isSaved(id)){S.saved=S.saved.filter(y=>y!==id);toast("Removed from Liked tracks"+x)}else{S.saved.unshift(id);toast("Added to Liked tracks"+x)}saveLibCache();after()}
function toggleFollow(id){if(S.followed.includes(id)){S.followed=S.followed.filter(x=>x!==id);toast("Unfollowed "+ARBY[id].name)}else{S.followed.unshift(id);toast("Following "+ARBY[id].name)}after()}
function toggleAlbum(id){if(S.savedAlbums.includes(id)){S.savedAlbums=S.savedAlbums.filter(x=>x!==id);toast("Removed from Albums")}else{S.savedAlbums.unshift(id);toast("Added to Albums")}after()}
function startDJ(seed){const d=S.dj;d.on=true;d.radio=null;d.count=0;S.queue=S.queue.filter(q=>q.src==="you");

  `<div class="actions" style="justify-content:center"><button class="btn" data-act="settings">Customise home</button></div>`}

  const rel=newReleases();const grp=[["This week",a=>a.age<7],["Last week",a=>a.age>=7&&a.age<14],["Earlier this month",a=>a.age>=14]];

  h+=`<div style="height:16px"></div>`+HS.artists.render();
  if(!hasArea())h+=section("Concerts and events",noArea);
  else{const ev=allEvents();h+=section("Concerts and events",(ev.length?ev.slice(0,5).map(evRow).join(""):`<p class="note">No upcoming shows found for your area.</p>`),ev.length>5?'data-act="open" data-kind="events" data-id="all"':"")}

function sBody(){const q=ui.query.trim().toLowerCase();

        ui.tagLoading?`<p class="note">Working out your genres from your saved artists.</p>`:ui.tagErr&&!ug.length?`<p class="note" style="color:var(--danger)">Couldn't get genres from Last.fm: ${esc(ui.tagErr)}</p>`:ug.length?`<p class="note">Outlined genres come from your saved artists, most listened first.</p>`:"";

      section("Browse",`<button class="listbtn" data-act="open" data-kind="liked" data-id="liked">${cover("liked")}<div class="meta"><div class="t">Liked tracks</div><div class="s">${S.saved.length} tracks</div></div></button>`+
        `<button class="listbtn" data-act="open" data-kind="coll" data-id="playlists">${cover("playlist",(S.playlists[0]||{}).id)}<div class="meta"><div class="t">Your playlists</div><div class="s">${S.playlists.length} playlists</div></div></button>`+
        `<button class="listbtn" data-act="open" data-kind="coll" data-id="albums">${S.savedAlbums[0]?cover("album",S.savedAlbums[0]):cover("genre","Albums")}<div class="meta"><div class="t">Your albums</div><div class="s">${S.savedAlbums.length} albums</div></div></button>`+
        `<button class="listbtn" data-act="open" data-kind="dj" data-id="dj"><div class="cover radio" style="width:56px">${ic("dj",26)}</div><div class="meta"><div class="t">DJ</div><div class="s">Mix your saved songs with new ones</div></div></button>`)+
      `<p class="note">Genre pages are Tidal searches for that genre, sorted the way you choose.</p>`;}const rs=remoteState(ui.query.trim());const pl=S.playlists.filter(p=>p.name.toLowerCase().includes(q));
    if(rs.loading)return `<p class="note">Searching Tidal.</p>`;if(rs.err)return `<p class="note" style="color:var(--danger)">Search failed: ${esc(rs.err)}</p>`;

    const mode=S.set.searchSort||"rel";const st=sortTracks(rs.tracks,mode,ui.query.trim()),sa=sortArtists(rs.artists,mode);

      (st.length?section("Tracks",listHTML(st,{kind:"search",id:"q",name:"Search results"},true)):"")}
  if(!q)return section("Genres",`<div class="chips" style="flex-wrap:wrap;overflow:visible">${GENRES.map(g=>`<button class="chip" data-act="open" data-kind="genre" data-id="${esc(g)}">${esc(g)}</button>`).join("")}</div>`)+
    section("Browse",`<button class="listbtn" data-act="open" data-kind="all" data-id="newalbums">${cover("genre","New")}<div class="meta"><div class="t">New releases</div></div></button><button class="listbtn" data-act="open" data-kind="all" data-id="mixes">${cover("mix","daily")}<div class="meta"><div class="t">Your mixes</div></div></button>`);
  const m=x=>x.toLowerCase().includes(q);

  if(!ar.length&&!al.length&&!tr.length&&!pl.length)return `<p class="note">Nothing matches "${esc(ui.query)}". Try an artist, or a genre like shoegaze.</p>`;

    (pl.length?section("Your playlists",`<div class="hscroll">${pl.map(p=>card("playlist",p.id,p.name,plCount(p)+" tracks")).join("")}</div>`):"")+
    (al.length?section("Albums",`<div class="hscroll">${al.map(a=>card("album",a.id,a.title,a.artist)).join("")}</div>`):"")+
    (tr.length?section("Tracks",listHTML(tr,{kind:"search",id:"q",name:"Search results"},true)):"")}
function vSearch(){return head("Search")+`<input class="search" id="q" type="search" placeholder="Search" value="${esc(ui.query)}" aria-label="Search"><div id="sbody">${sBody()}</div>`}

/* ---------- pages ---------- */
function heroPage(kind,id,title,sub,acts,body){return phead("")+`<div class="hero">${cover(kind,id,false)}<h1>${esc(title)}</h1><div class="s">${sub}</div><div class="actions">${acts}</div></div>`+body}
const playBtns=(kind,id)=>`<button class="btn primary" data-act="playctx" data-kind="${kind}" data-id="${id}">Play</button><button class="btn" data-act="playctx" data-kind="${kind}" data-id="${id}" data-shuf="1">Smart shuffle</button>`;

  playlist(p){const pl=PL(p.id);if(!pl)return phead("")+`<p class="note">This playlist was deleted.</p>`;

  artist(p){const a=ARBY[p.id];const fol=S.followed.includes(a.id);if(a.real)return realArtistPage(a,fol);const al=ALBUMS.filter(x=>x.arId===a.id);
    const sim=ARTISTS.filter(x=>x.id!==a.id&&!x.real&&(x.genre===a.genre||(NEIGH[a.genre]||[]).includes(x.genre))).slice(0,8);
    const ev=hasArea()?allEvents().filter(e=>e.arId===a.id):[];
    return heroPage("artist",a.id,a.name,esc(a.genre),`<button class="btn primary" data-act="playctx" data-kind="artist" data-id="${a.id}">Play</button>${a.real?"":`<button class="btn" data-act="open" data-kind="radio" data-id="${a.id}">Artist radio</button>`}<button class="btn" data-act="follow" data-id="${a.id}">${fol?"Following":"Follow"}</button>`,
      section("Popular tracks",listHTML(artistTracks(a.id),{kind:"artist",id:a.id,name:a.name},true))+
      section("Albums",`<div class="hscroll">${al.map(x=>card("album",x.id,x.title,String(x.year))).join("")}</div>`)+
      (a.real?`<p class="note">Showing the tracks by this artist that are in your library or recent searches.</p>`:section("Upcoming shows",hasArea()?(ev.length?ev.map(evRow).join(""):`<p class="note">No shows in your area right now.</p>`):noArea)+
      section("Similar artists",`<div class="hscroll">${sim.map(x=>card("artist",x.id,x.name,x.genre)).join("")}</div>`)))},
  mix(p){const m=getMix(p.id);
    const pp=m.period,ps=pp&&pickSet(pp),saved=pp?!!(ps&&ps.saved):S.picksSaved,busy=pp&&ui.pl[pp];
    if(pp&&!busy&&!m.ids.length&&!ui.pmsg[pp])setTimeout(()=>buildPicks(pp),0);
    const extra=m.temp?`<button class="btn" data-act="savepicks" data-p="${pp||""}" ${saved||!m.ids.length?"disabled":""}>${saved?"Saved as playlist":"Save as playlist"}</button><button class="btn" data-act="newpicks" data-p="${pp||""}" ${busy?"disabled":""}>${S.realMode?(busy?"Building":"Rebuild"):"New picks (demo)"}</button>`:"";

  events(){const scopes=["All","Local","Regional","National","Nearby"];const ev=allEvents().filter(e=>ui.evFilter==="All"||e.scope===ui.evFilter);

  themes(){return vThemes()},

function vQueue(){
  if(!S.current)return `<p class="note">Nothing is playing. Tap a song anywhere, or start the DJ.</p><div class="actions"><button class="btn primary" data-act="djgo">Start the DJ</button></div>`;
  const t=T(S.current);
  let h=`<h2 class="plain" style="margin-top:0">Now playing</h2><div class="nowcard"><div class="art" style="${AS(t)}">${esc(t.artist[0])}</div><div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div>
    <button class="iconbtn heart" data-act="heartcur" aria-pressed="${isSaved(t.id)}" aria-label="Add to Liked tracks">${ic(isSaved(t.id)?"heartF":"heart",20)}</button></div>`;
  const src=S.dj.on?(S.dj.radio?S.dj.radio+" radio":"the DJ"):S.shuffle?"smart shuffle of "+S.ctxName:S.ctxName;
  const nd=S.set.swipeRight==="next"?"right":"left",od=nd==="right"?"left":"right";
  h+=`<h2 class="plain">Up next</h2><p class="note">Then playing from ${esc(src)}. Swipe ${nd} to play next, ${od} to remove. Drag the handle to reorder. Tap a song to play it now or move it up.</p>`;
  if(S.dj.on&&!S.dj.radio)h+=`<div class="path">${S.dj.drift?"Genre path":"Locked to"} ${S.dj.path.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>`;
  if(!S.queue.length)return h+`<p class="note">The queue is empty.</p>`;
  h+=`<ul class="list drag-list" id="qlist">${S.queue.map((it,i)=>rowHTML(it.id,{idx:i,q:true})).join("")}</ul>`;
  if(S.queue.some(q=>q.src==="you"))h+=`<div class="actions" style="margin-top:12px"><button class="btn" data-act="clearyou">Clear songs I added</button></div>`;
  return h}
function vDJ(){const d=S.dj;const on=d.on&&!d.radio;
  let h=`<p class="note">${on?`The DJ is on, playing ${esc(d.genre)}.`:"The DJ mixes new songs with ones you've already saved, and can slowly move between related genres."}</p>
  <div class="actions">${on?`<button class="btn primary" data-act="open" data-kind="queue" data-id="q">See the mix</button><button class="btn" data-act="djstop">Stop the DJ</button>`:`<button class="btn primary" data-act="djgo">${S.current?"Start from what's playing":"Start the DJ"}</button>`}<button class="btn" data-act="djseed">Start from a song</button></div>

  <div class="field"><div class="top"><label for="djdrift">Let genres drift</label><input type="checkbox" class="switch" id="djdrift" ${d.drift?"checked":""}></div><small>${d.drift?"Every few songs it moves to a neighbouring genre, so the mix changes gradually.":"Stays in the genre it started with."}</small></div>

function sel(path,opts,cur,label,id){return `<select class="inp" id="${id}" data-set="${path}" aria-label="${esc(label)}">${opts.map(([v,l])=>`<option value="${v}" ${String(v)===String(cur)?"selected":""}>${esc(l)}</option>`).join("")}</select>`}
function srow(list,k,title,on,i){return `<li class="srow${on?"":" off"}" data-idx="${i}"><button class="iconbtn handle" data-drag="${list}" aria-label="Drag to reorder ${esc(title)}, or use arrow keys">${ic("grip",20)}</button><span class="sl">${esc(title)}</span><input type="checkbox" class="switch" data-toggle="${list}" data-key="${k}" ${on?"checked":""} aria-label="Show ${esc(title)}"></li>`}

const PRESETS=[
 {id:"lagoon",name:"Lagoon",light:{bg:"#F1F8F7",card:"#DDEEEC",text:"#0A2730",accent:"#0B8378",next:"#A66A00"},dark:{bg:"#04141C",card:"#0E2833",text:"#EAF6F6",accent:"#3FD9C9",next:"#FFC857"}},
 {id:"reef",name:"Reef",light:{bg:"#FFF7F3",card:"#F6E3DC",text:"#1A2140",accent:"#C8452F",next:"#2B6CB0"},dark:{bg:"#0A1630",card:"#16264A",text:"#F2F4FA",accent:"#FF7F6E",next:"#FFD166"}},
 {id:"kelp",name:"Kelp forest",light:{bg:"#F4F6EC",card:"#E2E9D2",text:"#1C2A1A",accent:"#4D7A22",next:"#9A5B00"},dark:{bg:"#0C1A12",card:"#183022",text:"#EEF3E6",accent:"#9CCB5B",next:"#E9A93B"}},
 {id:"abyss",name:"Abyss",light:{bg:"#EEF3FB",card:"#DCE5F3",text:"#0B1424",accent:"#1565C0",next:"#7B3FC4"},dark:{bg:"#01040A",card:"#0B1424",text:"#DCE8FF",accent:"#5CE1FF",next:"#C78BFF"}},
 {id:"mediterraneo",name:"Mediterráneo",light:{bg:"#FAF8F2",card:"#E9E4D8",text:"#0D2340",accent:"#1A5FB4",next:"#B0820A"},dark:{bg:"#071A33",card:"#12294A",text:"#F7F4EC",accent:"#4EA8FF",next:"#F4D35E"}},
 {id:"slack",name:"Slack water",light:{bg:"#EEF3F1",card:"#E1EBE8",text:"#12262E",accent:"#1A8466",next:"#A87505"},dark:{bg:"#13262F",card:"#1F3B47",text:"#EAF1EC",accent:"#7FD8BE",next:"#F2C14E"}}];
function hex2rgb(h){h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
function rgb2hex(r){return "#"+r.map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,"0")).join("")}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((x,i)=>x+(B[i]-x)*t))}
function lum(h){const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const onC=c=>lum(c)>.35?"#0A0A0A":"#FFFFFF";
function tokens(v,dark){return{"--bg":v.bg,"--surface":dark?mix(v.bg,v.text,.07):mix(v.bg,"#FFFFFF",.75),"--card":v.card,"--raise":mix(v.card,v.text,dark?.1:.08),"--line":mix(v.card,v.text,dark?.14:.12),
  "--text":v.text,"--muted":mix(v.text,v.bg,.4),"--accent":v.accent,"--end":v.accent,"--next":v.next,"--danger":dark?"#FF7A68":"#C2402F","--onaccent":dark?"#000000":"#FFFFFF"}}
const allThemes=()=>[...PRESETS,...S.customThemes];
const themeById=id=>allThemes().find(t=>t.id===id)||PRESETS[0];
const toMin=t=>{const[h,m]=String(t||"0:0").split(":").map(Number);return(h||0)*60+(m||0)};
let ambientDark=null,sensor=null;
function isDark(){const t=S.set.theme;
  if(t.ambient&&ambientDark!==null)return ambientDark;
  if(t.appearance==="light")return false;if(t.appearance==="dark")return true;
  if(t.appearance==="schedule"){const n=new Date(),m=n.getHours()*60+n.getMinutes(),f=toMin(t.from),e=toMin(t.to);return f<=e?(m>=f&&m<e):(m>=f||m<e)}
  return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
function applyTheme(){const dark=isDark();const th=themeById(S.set.lowDist?S.set.theme.neap:S.set.theme.spring);const v=th[dark?"dark":"light"];
  const tk=tokens(v,dark),r=document.documentElement;for(const k in tk)r.style.setProperty(k,tk[k]);
  r.setAttribute("data-theme",dark?"dark":"light");r.style.colorScheme=dark?"dark":"light";
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute("content",v.bg)}
function setupAmbient(){if(sensor){try{sensor.stop()}catch(_){}sensor=null}ambientDark=null;ui.ambientMsg="";
  if(!S.set.theme.ambient)return;
  if(!("AmbientLightSensor" in window)){ui.ambientMsg="unsupported";return}
  try{sensor=new window.AmbientLightSensor();
    sensor.addEventListener("reading",()=>{const lx=sensor.illuminance,prev=ambientDark;if(lx<15)ambientDark=true;else if(lx>60)ambientDark=false;if(prev!==ambientDark){applyTheme();if(ui.stack.length&&ui.stack[ui.stack.length-1].type==="settings")renderView()}});
    sensor.addEventListener("error",()=>{ui.ambientMsg="blocked";ambientDark=null;applyTheme()});sensor.start();ui.ambientMsg="on"}catch(e){ui.ambientMsg="blocked"}}
function ambientNote(){const t=S.set.theme;
  if(!t.ambient)return "Goes dark in a dim room and light in a bright one. While it has a reading, it overrides the setting above.";
  if(ui.ambientMsg==="unsupported")return "This browser doesn't share light sensor readings, so the setting above is used for now. It will work in the Android app.";
  if(ui.ambientMsg==="blocked")return "The light sensor was blocked, so the setting above is used instead.";
  return ambientDark===null?"Waiting for a light reading.":"The room is "+(ambientDark?"dim, so the dark version is on.":"bright, so the light version is on.")}
function appearanceHTML(){const t=S.set.theme,N=S.set.names;const o=allThemes().map(x=>[x.id,x.name]);
  const selT=k=>`<select class="inp" id="th-${k}" data-th="${k}">${o.map(([v,l])=>`<option value="${v}" ${t[k]===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  return `<h2 class="plain">Appearance</h2>
  <div class="field"><div class="top"><label for="th-spring">${esc(N.spring)} mode theme</label>${selT("spring")}</div></div>
  <div class="field"><div class="top"><label for="th-neap">${esc(N.neap)} mode theme</label>${selT("neap")}</div></div>
  <div class="actions" style="padding:12px 16px"><button class="btn" data-act="openthemes">Browse and create themes</button></div>
  <div class="field"><div class="top"><label for="th-app">Light or dark</label><select class="inp" id="th-app" data-th="appearance">${[["system","Match my phone"],["light","Always light"],["dark","Always dark"],["schedule","Dark at night"]].map(([v,l])=>`<option value="${v}" ${t.appearance===v?"selected":""}>${l}</option>`).join("")}</select></div><small>Using the ${isDark()?"dark":"light"} version right now.</small></div>
  ${t.appearance==="schedule"?`<div class="field"><div class="top"><label for="th-from">Dark from</label><input type="time" class="inp" id="th-from" data-th="from" value="${esc(t.from)}"></div></div><div class="field"><div class="top"><label for="th-to">Light again at</label><input type="time" class="inp" id="th-to" data-th="to" value="${esc(t.to)}"></div></div>`:""}

const NAMEP=[["Spring","Neap"],["Pelagic","Benthic"],["Flood","Ebb"],["Swell","Slack"]];
function namesHTML(){const N=S.set.names;const cur=NAMEP.find(([a,b])=>a===N.spring&&b===N.neap);
  return `<h2 class="plain">Mode names</h2><p class="note">You found the deep end. Rename the two modes.</p>
  <div class="field"><div class="top"><label for="nm-pre">Names</label><select class="inp" id="nm-pre" data-names="preset">${NAMEP.map(([a,b])=>`<option value="${a}|${b}" ${cur&&cur[0]===a?"selected":""}>${a} and ${b}</option>`).join("")}<option value="custom" ${cur?"":"selected"}>Custom</option></select></div></div>

function previewHTML(v,dark){const t=tokens(v,dark);const w=[];
